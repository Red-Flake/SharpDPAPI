name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild SharpDPAPI.sln /t:Build /p:Configuration=%CONFIGURATION% /p:Platform="Any CPU" /m
        shell: cmd

      - name: Stage artifacts
        run: |
          mkdir dist
          copy "SharpDPAPI\bin\%CONFIGURATION%\SharpDPAPI.exe" dist\
          copy "SharpChrome\bin\%CONFIGURATION%\SharpChrome.exe" dist\
        shell: cmd

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SharpDPAPI-${{ env.CONFIGURATION }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Compute short SHA
        if: github.ref == 'refs/heads/master'
        id: sha
        run: echo "short=$("${GITHUB_SHA}".Substring(0,7))" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SharpDPAPI-${{ steps.sha.outputs.short }}
          name: SharpDPAPI-${{ steps.sha.outputs.short }}
          files: dist/*.exe
