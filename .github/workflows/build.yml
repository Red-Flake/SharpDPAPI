name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild SharpDPAPI.sln /t:Build /p:Configuration=%CONFIGURATION% /p:Platform="Any CPU" /m
        shell: cmd

      - name: Stage artifacts
        run: |
          mkdir dist
          copy "SharpDPAPI\bin\%CONFIGURATION%\SharpDPAPI.exe" dist\
          copy "SharpChrome\bin\%CONFIGURATION%\SharpChrome.exe" dist\
        shell: cmd

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SharpDPAPI-${{ env.CONFIGURATION }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: dist/*.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
