name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      CONFIGURATION: Release
      PLATFORM: Any CPU
      TARGET_FRAMEWORK_VERSION: v4.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: |
          msbuild SharpDPAPI.sln `
            /restore `
            /t:Build `
            /m `
            /p:Configuration="$env:CONFIGURATION" `
            /p:Platform="$env:PLATFORM" `
            /p:TargetFrameworkVersion="$env:TARGET_FRAMEWORK_VERSION"

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in 'SharpDPAPI', 'SharpChrome') {
            $exe = "$name\bin\$env:CONFIGURATION\$name.exe"
            if (-not (Test-Path $exe)) {
              throw "Expected build output was not found: $exe"
            }
            Get-Item $exe | Format-List FullName, Length, LastWriteTime
            Copy-Item $exe dist\
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SharpDPAPI-${{ env.CONFIGURATION }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Compute short SHA
        if: github.ref == 'refs/heads/master'
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SharpDPAPI-${{ steps.sha.outputs.short }}
          name: SharpDPAPI-${{ steps.sha.outputs.short }}
          files: dist/*.exe
